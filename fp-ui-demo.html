<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casework UI demo</title>
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("casework.theme")||"dark";if(t!=="system")document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fp.css">
<style>
  /* dev only: a painted office corridor standing in for the 3D view */
  .demo-room { position: absolute; inset: 0; background:
    radial-gradient(ellipse 30% 18% at 50% 6%, rgb(230 240 245 / 0.35), transparent 70%),
    linear-gradient(180deg, #2a3438 0%, #34403f 52%, #1b2022 52%, #121617 100%); }
  .demo-room::before { content: ""; position: absolute; left: 0; right: 0; top: 52%; bottom: 0; background:
    repeating-linear-gradient(90deg, transparent 0 58px, rgb(255 255 255 / 0.05) 58px 60px),
    repeating-linear-gradient(0deg, transparent 0 38px, rgb(255 255 255 / 0.05) 38px 40px); transform: perspective(300px) rotateX(55deg); transform-origin: top; }
  .demo-board { position: absolute; left: 50%; top: 30%; width: min(42vw, 300px); aspect-ratio: 1.5; transform: translateX(-50%); background: #b99f74; border: 8px solid #5d4a33; border-radius: 4px; box-shadow: 0 12px 30px rgb(0 0 0 / 0.5); }
  .demo-board::after { content: ""; position: absolute; inset: 14% 12% auto 10%; height: 46%; background: repeating-linear-gradient(90deg, #f3efe4 0 28%, transparent 28% 36%); opacity: .85; }
  .demo-door { position: absolute; left: 7%; top: 22%; width: 13%; height: 31%; background: #4c5a5d; border: 4px solid #2a3235; }
</style>
</head>
<body>
<div id="game" class="fp-root">
  <div class="demo-room" aria-hidden="true"><div class="demo-door"></div><div class="demo-board"></div></div>
</div>
<script type="module" src="dist/adapters/fp/ui/demo.js"></script>
</body>
</html>
