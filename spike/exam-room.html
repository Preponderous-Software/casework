<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casework: exam room spike</title>
<style>
  :root {
    --bg: #1d2426; --panel: rgba(18, 24, 26, 0.82); --fg: #e6eeee; --muted: #a9b8b8; --accent: #5bbdcc;
    --sk-loader-bg: #1d2426; --sk-loader-accent: #5bbdcc;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; }
  header { padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--panel);
    display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #last { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  .stage { position: relative; min-height: 0; overflow: auto; }
  canvas#view { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
  canvas#view.dragging { cursor: grabbing; }
  #fallback { padding: 24px 16px; max-width: 560px; }
  #fallback h2 { font-size: 17px; margin: 0 0 8px; }
  footer { background: var(--panel); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: grid; gap: 8px; }
  button { font: inherit; color: var(--fg); background: #2d3a3d; border: 1px solid #44575b; border-radius: 8px;
    min-height: 44px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #36474b; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #turn { background: #2f5a62; border-color: #4a8a95; font-weight: 600; justify-self: start; }
  #regions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  #regions button { flex: none; font-size: 14px; min-height: 40px; }
  #regions button.lit { background: #2f5a62; border-color: var(--accent); }
  .list-mode #regions { flex-wrap: wrap; overflow: visible; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Exam room (spike)</h1>
  <span>Last event: <span id="last" aria-live="polite">none yet</span></span>
  <span id="status" role="status"></span>
</header>
<div class="stage">
  <canvas id="view" tabindex="0" aria-label="3D exam room: drag to look around, pinch or scroll to zoom, tap the body to examine a region"></canvas>
  <div id="fallback" hidden>
    <h2>The 3D exam room is not available here</h2>
    <p class="why"></p>
    <p>You can still examine the body: pick a region from the list below.</p>
  </div>
</div>
<footer>
  <button id="turn" type="button">Turn the body</button>
  <div id="regions" role="group" aria-label="Body regions"></div>
  <p class="hint">Drag to orbit, pinch or scroll to zoom, tap the body. Engine: Strata, via Tangle's static-room host.</p>
</footer>
<script src="../engine/strata-loader.js"></script>
<script src="../engine/strata-kit.js"></script>
<script type="module" src="../dist/adapters/exam3d/spike-main.js"></script>
</body>
</html>
