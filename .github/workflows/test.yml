# Tests the kernel, the game rules and the layer rule, then deploys the game to the arcade as
# https://casework.play.danielstephenson.dev (pushes to main, only while ARCADE_ENABLED is set).
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to the arcade
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Gather the site
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp *.html styles.css "$site/"
          cp -r dist "$site/"
          [ -d engine ] && mkdir -p "$site/engine" && cp engine/*.js engine/*.wasm "$site/engine/" || true
          [ -d packs ] && cp -r packs "$site/" || true
          echo "SITE=$site" >> "$GITHUB_ENV"
          echo "0.0.1+g${GITHUB_SHA::7}" > "$RUNNER_TEMP/arcade-version.txt"
          find "$site" -type f | sort
      - uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: casework
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: ${{ env.SITE }}
          version-file: ${{ runner.temp }}/arcade-version.txt
